<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}" {{ if in site.Language.Lang "ar" }}dir="rtl"{{ end }}>
<head>
  {{ partial "site_head" . }}
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Force light mode background by default */
    body {
      background-color: #ffffff !important;
    }
    
    /* Dark mode override */
    html.dark body {
      background-color: #0a0a0a !important;
    }
  </style>
</head>
<body>
  {{ partial "components/headers/navbar" . }}
  
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "site_footer" . }}
</body>
</html>
