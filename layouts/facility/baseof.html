<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}" {{ if in site.Language.Lang "ar" }}dir="rtl"{{ end }}>
<head>
  {{ partial "site_head" . }}
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Ensure navbar stays above decorative bars */
    header,
    header nav,
    .navbar,
    [role="navigation"],
    body > header {
      position: relative;
      z-index: 1000 !important;
    }
    
    /* Force light mode background by default */
    body {
      background-color: #ffffff !important;
    }
    
    /* Light mode navbar text color */
    body header,
    body nav,
    body .navbar,
    body [role="navigation"] {
      color: #333 !important;
    }
    
    body header a,
    body nav a,
    body .navbar a {
      color: #333 !important;
    }
    
    /* Theme toggle button - light mode */
    button[aria-label*="theme" i],
    button[aria-label*="dark" i],
    button[aria-label*="light" i],
    .theme-toggle,
    [data-toggle="theme"] {
      background-color: transparent !important;
      color: black !important;
      border: none !important;
    }
    
    button[aria-label*="theme" i] svg,
    button[aria-label*="dark" i] svg,
    button[aria-label*="light" i] svg,
    .theme-toggle svg,
    [data-toggle="theme"] svg {
      fill: none !important;
      color: black !important;
      stroke: black !important;
      stroke-width: 2px !important;
    }
    
    /* Theme toggle hover - change icon color, not background */
    button[aria-label*="theme" i]:hover,
    button[aria-label*="dark" i]:hover,
    button[aria-label*="light" i]:hover,
    .theme-toggle:hover,
    [data-toggle="theme"]:hover {
      background-color: transparent !important;
    }
    
    button[aria-label*="theme" i]:hover svg,
    button[aria-label*="dark" i]:hover svg,
    button[aria-label*="light" i]:hover svg,
    .theme-toggle:hover svg,
    [data-toggle="theme"]:hover svg {
      stroke: #1a5f4f !important;
    }
    
    /* Dark mode override */
    html.dark body {
      background-color: #0a0a0a !important;
    }
    
    html.dark header,
    html.dark nav,
    html.dark .navbar,
    html.dark [role="navigation"] {
      color: #e0e0e0 !important;
    }
    
    html.dark header a,
    html.dark nav a,
    html.dark .navbar a {
      color: #e0e0e0 !important;
    }
    
    /* Theme toggle button - dark mode */
    html.dark button[aria-label*="theme" i],
    html.dark button[aria-label*="dark" i],
    html.dark button[aria-label*="light" i],
    html.dark .theme-toggle,
    html.dark [data-toggle="theme"] {
      background-color: transparent !important;
      color: white !important;
      border: none !important;
    }
    
    html.dark button[aria-label*="theme" i] svg,
    html.dark button[aria-label*="dark" i] svg,
    html.dark button[aria-label*="light" i] svg,
    html.dark .theme-toggle svg,
    html.dark [data-toggle="theme"] svg {
      fill: none !important;
      color: white !important;
      stroke: white !important;
      stroke-width: 2px !important;
    }
    
    /* Theme toggle hover - dark mode - change icon color, not background */
    html.dark button[aria-label*="theme" i]:hover,
    html.dark button[aria-label*="dark" i]:hover,
    html.dark button[aria-label*="light" i]:hover,
    html.dark .theme-toggle:hover,
    html.dark [data-toggle="theme"]:hover {
      background-color: transparent !important;
    }
    
    html.dark button[aria-label*="theme" i]:hover svg,
    html.dark button[aria-label*="dark" i]:hover svg,
    html.dark button[aria-label*="light" i]:hover svg,
    html.dark .theme-toggle:hover svg,
    html.dark [data-toggle="theme"]:hover svg {
      stroke: #6ee7b7 !important;
    }
    
    /* Fix card size when only 1 item in grid - for HugoBlox collection blocks */
    section[class*="collection"] .row,
    section[class*="collection"] .grid,
    section[class*="collection"] > div > div,
    .article-grid .grid,
    .article-grid > div,
    [class*="col-"].row,
    .container .row {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr) !important;
      gap: 1.5rem !important;
      width: 100% !important;
      margin: 0 !important;
    }
    
    section[class*="collection"] .row > *,
    section[class*="collection"] .grid > *,
    section[class*="collection"] > div > div > *,
    .article-grid .grid > *,
    .article-grid > div > *,
    .container .row > * {
      min-width: 0 !important;
      max-width: 100% !important;
      width: 100% !important;
      flex: none !important;
    }
    
    /* Force card width for single items */
    section[class*="collection"] article,
    section[class*="collection"] .card,
    [class*="col-12"] {
      width: 100% !important;
      max-width: 100% !important;
      flex-basis: 100% !important;
    }
    
    @media (max-width: 768px) {
      section[class*="collection"] .row,
      section[class*="collection"] .grid,
      section[class*="collection"] > div > div,
      .article-grid .grid,
      .article-grid > div,
      [class*="col-"].row,
      .container .row {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>
  {{ partial "components/headers/navbar" . }}
  
  <!-- Decorative Background Bars -->
  <div class="decorative-bg decorative-bg-left"></div>
  <div class="decorative-bg decorative-bg-right"></div>
  
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "site_footer" . }}
  
  <script>
    // Change theme toggle button hover text
    document.addEventListener('DOMContentLoaded', function() {
      function updateThemeToggleText() {
        const themeButtons = document.querySelectorAll('button[aria-label*="theme" i], button[aria-label*="appearance" i], button[aria-label*="dark" i], button[aria-label*="light" i], .theme-toggle, [data-toggle="theme"]');
        themeButtons.forEach(function(button) {
          button.setAttribute('aria-label', 'Toggle Light/Dark Mode');
          button.setAttribute('title', 'Toggle Light/Dark Mode');
        });
      }
      
      updateThemeToggleText();
      
      // Re-run after a short delay in case buttons are dynamically created
      setTimeout(updateThemeToggleText, 500);
    });
  </script>
</body>
</html>
