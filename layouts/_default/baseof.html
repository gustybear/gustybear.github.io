<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}" {{ if in site.Language.Lang "ar" }}dir="rtl"{{ end }}>
<head>
  {{ partial "site_head" . }}
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Force light mode background and text colors by default */
    body {
      background-color: #ffffff !important;
      color: #333 !important;
    }
    
    body h1, body h2, body h3, body h4, body h5, body h6,
    body p, body span, body div, body li {
      color: #333 !important;
    }
    
    /* Regular links dark in light mode, but with exceptions */
    body a {
      color: #333 !important;
    }
    
    /* Theme toggle button - light mode */
    button[aria-label*="theme" i],
    button[aria-label*="dark" i],
    button[aria-label*="light" i],
    .theme-toggle,
    [data-toggle="theme"] {
      background-color: transparent !important;
      color: black !important;
      border: none !important;
    }
    
    button[aria-label*="theme" i] svg,
    button[aria-label*="dark" i] svg,
    button[aria-label*="light" i] svg,
    .theme-toggle svg,
    [data-toggle="theme"] svg {
      fill: none !important;
      color: black !important;
      stroke: black !important;
      stroke-width: 2px !important;
    }
    
    /* Exception: Author social icons should keep their own colors */
    .author-social a {
      background: #1a5f4f !important;
      color: white !important;
    }
    
    .author-social a i,
    .author-social a svg,
    .author-social a i::before,
    .author-social i.fas,
    .author-social i.fab,
    .author-social i.fa {
      color: white !important;
      fill: white !important;
      opacity: 1 !important;
      display: inline-block !important;
      visibility: visible !important;
    }
    
    /* Light mode navbar text color */
    body header,
    body nav,
    body .navbar,
    body [role="navigation"] {
      color: #333 !important;
    }
    
    body header a,
    body nav a,
    body .navbar a {
      color: #333 !important;
    }
    
    /* EXCEPTION: Hero section always has white text on green background */
    body [class*="blox-resume-biography"] h1,
    body [class*="blox-resume-biography"] h2,
    body [class*="blox-resume-biography"] h3,
    body [class*="blox-resume-biography"] h4,
    body [class*="blox-resume-biography"] h5,
    body [class*="blox-resume-biography"] h6,
    body [class*="blox-resume-biography"] p,
    body [class*="blox-resume-biography"] span,
    body [class*="blox-resume-biography"] div,
    body [class*="blox-resume-biography"] li {
      color: white !important;
    }
    
    body [class*="blox-resume-biography"] a {
      color: #6ee7b7 !important;
    }
    
    body [class*="blox-resume-biography"] a:hover {
      color: #86efac !important;
    }
    
    /* Social icons and buttons - light mode */
    body .btn,
    body button,
    body [class*="btn-"] {
      background-color: #1a5f4f !important;
    }
    
    body .btn,
    body button,
    body [class*="btn-"],
    body .btn i,
    body button i,
    body [class*="btn-"] i,
    body .btn svg,
    body button svg,
    body [class*="btn-"] svg {
      color: white !important;
      fill: white !important;
    }
    
    body .btn:hover,
    body button:hover,
    body [class*="btn-"]:hover {
      background-color: #2d7a66 !important;
    }
    
    /* Dark mode override */
    html.dark body {
      background-color: #0a0a0a !important;
      color: #e0e0e0 !important;
    }
    
    html.dark h1, html.dark h2, html.dark h3, html.dark h4, html.dark h5, html.dark h6,
    html.dark p, html.dark span, html.dark div, html.dark li {
      color: #e0e0e0 !important;
    }
    
    /* Regular links light in dark mode, but with exceptions */
    html.dark a {
      color: #e0e0e0 !important;
    }
    
    /* Theme toggle button - dark mode */
    html.dark button[aria-label*="theme" i],
    html.dark button[aria-label*="dark" i],
    html.dark button[aria-label*="light" i],
    html.dark .theme-toggle,
    html.dark [data-toggle="theme"] {
      background-color: transparent !important;
      color: white !important;
      border: none !important;
    }
    
    html.dark button[aria-label*="theme" i] svg,
    html.dark button[aria-label*="dark" i] svg,
    html.dark button[aria-label*="light" i] svg,
    html.dark .theme-toggle svg,
    html.dark [data-toggle="theme"] svg {
      fill: none !important;
      color: white !important;
      stroke: white !important;
      stroke-width: 2px !important;
    }
    
    /* Exception: Author social icons in dark mode */
    html.dark .author-social a {
      background: #6ee7b7 !important;
      color: #1a1a1a !important;
    }
    
    html.dark .author-social a i,
    html.dark .author-social a svg,
    html.dark .author-social a i::before,
    html.dark .author-social i.fas,
    html.dark .author-social i.fab,
    html.dark .author-social i.fa {
      color: #1a1a1a !important;
      fill: #1a1a1a !important;
      opacity: 1 !important;
      display: inline-block !important;
      visibility: visible !important;
    }
    
    html.dark header,
    html.dark nav,
    html.dark .navbar,
    html.dark [role="navigation"] {
      color: #e0e0e0 !important;
    }
    
    html.dark header a,
    html.dark nav a,
    html.dark .navbar a {
      color: #e0e0e0 !important;
    }
    
    /* Social icons and buttons - dark mode */
    html.dark .btn,
    html.dark button,
    html.dark [class*="btn-"] {
      background-color: #6ee7b7 !important;
    }
    
    html.dark .btn,
    html.dark button,
    html.dark [class*="btn-"],
    html.dark .btn i,
    html.dark button i,
    html.dark [class*="btn-"] i,
    html.dark .btn svg,
    html.dark button svg,
    html.dark [class*="btn-"] svg {
      color: #0a0a0a !important;
      fill: #0a0a0a !important;
    }
    
    html.dark .btn:hover,
    html.dark button:hover,
    html.dark [class*="btn-"]:hover {
      background-color: #86efac !important;
    }
    
    /* EXCEPTION: Hero section in dark mode also has white text */
    html.dark [class*="blox-resume-biography"] h1,
    html.dark [class*="blox-resume-biography"] h2,
    html.dark [class*="blox-resume-biography"] h3,
    html.dark [class*="blox-resume-biography"] h4,
    html.dark [class*="blox-resume-biography"] h5,
    html.dark [class*="blox-resume-biography"] h6,
    html.dark [class*="blox-resume-biography"] p,
    html.dark [class*="blox-resume-biography"] span,
    html.dark [class*="blox-resume-biography"] div,
    html.dark [class*="blox-resume-biography"] li {
      color: white !important;
    }
    
    html.dark [class*="blox-resume-biography"] a {
      color: #6ee7b7 !important;
    }
    
    html.dark [class*="blox-resume-biography"] a:hover {
      color: #86efac !important;
    }
    
    /* Fix card size when only 1 item in grid - for HugoBlox collection blocks */
    /* Add padding to the outermost section container only */
    section[class*="collection"] {
      padding-left: 5rem !important;
      padding-right: 5rem !important;
    }
    
    /* Prevent ALL parent containers from shrinking to fit content */
    section[class*="collection"],
    section[class*="collection"] > *,
    section[class*="collection"] > * > *,
    section[class*="collection"] > * > * > *,
    section[class*="collection"] .container,
    section[class*="collection"] .container-fluid {
      max-width: none !important;
      width: 100% !important;
      display: block !important;
    }
    
    /* Center subsection titles - force all parent containers to center */
    section[class*="collection"] > div:first-child,
    section[class*="collection"] header,
    section[class*="collection"] .mb-6 {
      width: 60% !important;
      max-width: 60% !important;
      margin-left: auto !important;
      margin-right: auto !important;
      display: block !important;
      text-align: center !important;
    }
    
    section[class*="collection"] h2,
    section[class*="collection"] h3 {
      text-align: center !important;
      width: 100% !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      display: block !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
    
    /* Fix card titles to wrap instead of overflow */
    section[class*="collection"] article h3,
    section[class*="collection"] .card h3,
    section[class*="collection"] article .card-title,
    section[class*="collection"] .card .card-title {
      white-space: normal !important;
      overflow-wrap: break-word !important;
      word-wrap: break-word !important;
      word-break: break-word !important;
      hyphens: auto !important;
    }
    
    /* Force the actual grid container to use CSS Grid with 2 equal columns */
    /* Scale down cards to 60% of viewport */
    section[class*="collection"] .row,
    section[class*="collection"] .grid,
    section[class*="collection"] > div > div,
    .article-grid .grid,
    .article-grid > div,
    [class*="col-"].row,
    .container .row {
      display: grid !important;
      grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
      gap: 1.5rem !important;
      width: 60% !important;
      max-width: 60% !important;
      min-width: 0 !important;
      margin-left: auto !important;
      margin-right: auto !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
    }
    
    /* Ensure grid items don't mess with the layout */
    section[class*="collection"] .row > *,
    section[class*="collection"] .grid > *,
    section[class*="collection"] > div > div > *,
    .article-grid .grid > *,
    .article-grid > div > *,
    .container .row > * {
      min-width: 0 !important;
      width: 100% !important;
      flex: none !important;
      grid-column: span 1 !important;
    }
    
    /* Prevent Bootstrap column classes from shrinking */
    section[class*="collection"] [class*="col-12"],
    section[class*="collection"] [class*="col-lg-"],
    section[class*="collection"] [class*="col-md-"],
    section[class*="collection"] [class*="col-sm-"] {
      width: 100% !important;
      max-width: none !important;
      flex: none !important;
      flex-grow: 0 !important;
      flex-shrink: 0 !important;
    }
    
    @media (max-width: 768px) {
      section[class*="collection"] .row,
      section[class*="collection"] .grid,
      section[class*="collection"] > div > div,
      .article-grid .grid,
      .article-grid > div,
      [class*="col-"].row,
      .container .row {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</head>
<body>
  {{ partial "components/headers/navbar" . }}
  
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "site_footer" . }}
</body>
</html>
