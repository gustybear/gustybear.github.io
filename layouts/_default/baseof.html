<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}" {{ if in site.Language.Lang "ar" }}dir="rtl"{{ end }}>
<head>
  {{ partial "site_head" . }}
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Force light mode background and text colors by default */
    body {
      background-color: #ffffff !important;
      color: #333 !important;
    }
    
    body h1, body h2, body h3, body h4, body h5, body h6,
    body p, body span, body div, body li, body a {
      color: #333 !important;
    }
    
    /* Light mode navbar text color */
    body header,
    body nav,
    body .navbar,
    body [role="navigation"] {
      color: #333 !important;
    }
    
    body header a,
    body nav a,
    body .navbar a {
      color: #333 !important;
    }
    
    /* EXCEPTION: Hero section always has white text on green background */
    body [class*="blox-resume-biography"] h1,
    body [class*="blox-resume-biography"] h2,
    body [class*="blox-resume-biography"] h3,
    body [class*="blox-resume-biography"] h4,
    body [class*="blox-resume-biography"] h5,
    body [class*="blox-resume-biography"] h6,
    body [class*="blox-resume-biography"] p,
    body [class*="blox-resume-biography"] span,
    body [class*="blox-resume-biography"] div,
    body [class*="blox-resume-biography"] li {
      color: white !important;
    }
    
    body [class*="blox-resume-biography"] a {
      color: #6ee7b7 !important;
    }
    
    body [class*="blox-resume-biography"] a:hover {
      color: #86efac !important;
    }
    
    /* Dark mode override */
    html.dark body {
      background-color: #0a0a0a !important;
      color: #e0e0e0 !important;
    }
    
    html.dark h1, html.dark h2, html.dark h3, html.dark h4, html.dark h5, html.dark h6,
    html.dark p, html.dark span, html.dark div, html.dark li, html.dark a {
      color: #e0e0e0 !important;
    }
    
    html.dark header,
    html.dark nav,
    html.dark .navbar,
    html.dark [role="navigation"] {
      color: #e0e0e0 !important;
    }
    
    html.dark header a,
    html.dark nav a,
    html.dark .navbar a {
      color: #e0e0e0 !important;
    }
    
    /* EXCEPTION: Hero section in dark mode also has white text */
    html.dark [class*="blox-resume-biography"] h1,
    html.dark [class*="blox-resume-biography"] h2,
    html.dark [class*="blox-resume-biography"] h3,
    html.dark [class*="blox-resume-biography"] h4,
    html.dark [class*="blox-resume-biography"] h5,
    html.dark [class*="blox-resume-biography"] h6,
    html.dark [class*="blox-resume-biography"] p,
    html.dark [class*="blox-resume-biography"] span,
    html.dark [class*="blox-resume-biography"] div,
    html.dark [class*="blox-resume-biography"] li {
      color: white !important;
    }
    
    html.dark [class*="blox-resume-biography"] a {
      color: #6ee7b7 !important;
    }
    
    html.dark [class*="blox-resume-biography"] a:hover {
      color: #86efac !important;
    }
  </style>
</head>
<body>
  {{ partial "components/headers/navbar" . }}
  
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "site_footer" . }}
</body>
</html>
