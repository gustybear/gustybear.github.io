<!DOCTYPE html>
<html lang="{{ site.Language.Lang }}" {{ if in site.Language.Lang "ar" }}dir="rtl"{{ end }}>
<head>
  {{ partial "site_head" . }}
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    /* Force light mode background and text colors by default */
    body {
      background-color: #ffffff !important;
      color: #333 !important;
    }
    
    body h1, body h2, body h3, body h4, body h5, body h6,
    body p, body span, body div, body li {
      color: #333 !important;
    }
    
    /* Exception: Article content and TOC headings should be green */
    .article-content h1,
    .article-content h2,
    .article-content h3,
    .article-content h4,
    .article-content h5,
    .article-content h6 {
      color: #1a5f4f !important;
    }
    
    .article-toc h4 {
      color: #1a5f4f !important;
    }
    
    /* Regular links dark in light mode, but with exceptions */
    body a {
      color: #333 !important;
    }
    
    /* Exception: Author social icons should keep their own colors */
    .author-social a {
      background: #1a5f4f !important;
      color: white !important;
    }
    
    .author-social a i,
    .author-social a svg,
    .author-social a i::before,
    .author-social i.fas,
    .author-social i.fab,
    .author-social i.fa {
      color: white !important;
      fill: white !important;
      opacity: 1 !important;
      display: inline-block !important;
      visibility: visible !important;
    }
    
    /* Light mode navbar text color */
    body header,
    body nav,
    body .navbar,
    body [role="navigation"] {
      color: #333 !important;
    }
    
    body header a,
    body nav a,
    body .navbar a {
      color: #333 !important;
    }
    
    /* Dark mode override */
    html.dark body {
      background-color: #0a0a0a !important;
      color: #e0e0e0 !important;
    }
    
    html.dark h1, html.dark h2, html.dark h3, html.dark h4, html.dark h5, html.dark h6,
    html.dark p, html.dark span, html.dark div, html.dark li {
      color: #e0e0e0 !important;
    }
    
    /* Exception: Article content and TOC headings should be green in dark mode */
    html.dark .article-content h1,
    html.dark .article-content h2,
    html.dark .article-content h3,
    html.dark .article-content h4,
    html.dark .article-content h5,
    html.dark .article-content h6 {
      color: #6ee7b7 !important;
    }
    
    html.dark .article-toc h4 {
      color: #6ee7b7 !important;
    }
    
    /* Theme toggle button - light mode */
    button[aria-label*="theme" i],
    button[aria-label*="dark" i],
    button[aria-label*="light" i],
    .theme-toggle,
    [data-toggle="theme"] {
      background-color: transparent !important;
      color: black !important;
      border: none !important;
    }
    
    button[aria-label*="theme" i] svg,
    button[aria-label*="dark" i] svg,
    button[aria-label*="light" i] svg,
    .theme-toggle svg,
    [data-toggle="theme"] svg {
      fill: none !important;
      color: black !important;
      stroke: black !important;
      stroke-width: 2px !important;
    }
    
    /* Regular links light in dark mode, but with exceptions */
    html.dark a {
      color: #e0e0e0 !important;
    }
    
    /* Theme toggle button - dark mode */
    html.dark button[aria-label*="theme" i],
    html.dark button[aria-label*="dark" i],
    html.dark button[aria-label*="light" i],
    html.dark .theme-toggle,
    html.dark [data-toggle="theme"] {
      background-color: transparent !important;
      color: white !important;
      border: none !important;
    }
    
    html.dark button[aria-label*="theme" i] svg,
    html.dark button[aria-label*="dark" i] svg,
    html.dark button[aria-label*="light" i] svg,
    html.dark .theme-toggle svg,
    html.dark [data-toggle="theme"] svg {
      fill: none !important;
      color: white !important;
      stroke: white !important;
      stroke-width: 2px !important;
    }
    
    /* Exception: Author social icons in dark mode */
    html.dark .author-social a {
      background: #6ee7b7 !important;
      color: #1a1a1a !important;
    }
    
    html.dark .author-social a i,
    html.dark .author-social a svg,
    html.dark .author-social a i::before,
    html.dark .author-social i.fas,
    html.dark .author-social i.fab,
    html.dark .author-social i.fa {
      color: #1a1a1a !important;
      fill: #1a1a1a !important;
      opacity: 1 !important;
      display: inline-block !important;
      visibility: visible !important;
    }
    
    html.dark header,
    html.dark nav,
    html.dark .navbar,
    html.dark [role="navigation"] {
      color: #e0e0e0 !important;
    }
    
    html.dark header a,
    html.dark nav a,
    html.dark .navbar a {
      color: #e0e0e0 !important;
    }
  </style>
</head>
<body>
  {{ partial "components/headers/navbar" . }}
  
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  
  {{ partial "site_footer" . }}
</body>
</html>
