name: Check website

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.2'
          extended: true
      - name: Build all pages
        run: hugo --minify --baseURL 'https://example.org/~yaozheng/'
        env:
          HUGO_ENVIRONMENT: production
      - name: Check shared styles and page shell
        run: python3 scripts/check_site.py public
      - name: Install browser for layout checks
        run: |
          npm install --prefix "$RUNNER_TEMP/site-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/site-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check desktop and mobile layouts
        run: node scripts/check_layout.mjs public
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/site-browser/node_modules/playwright/index.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-screenshots
          path: layout-screenshots/
      - uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: public/
